version: '3.8'
services:
  app:
    build: .
    restart: unless-stopped
    volumes:
      - ./uploads:/var/www/html/uploads

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - .:/var/www/html
    depends_on:
      - app