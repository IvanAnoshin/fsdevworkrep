version: '3.8'
services:
  app:
    build: .
    restart: unless-stopped
    volumes:
      - ./uploads:/var/www/html/uploads
    # Порты не публикуем наружу — будет доступен только через Caddy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - app

volumes:
  caddy_data: