server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;

    autoindex off;
    location ~ /\.          { deny all; }
    location ~* \.(env|log|sql|md|yml)$ { deny all; }
    location ~* ^/(vendor|node_modules|kopilot/cache) { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~* \.(css|js|gif|jpe?g|png|webp|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types application/json text/css application/javascript;
}